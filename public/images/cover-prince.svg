<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14223E"/>
      <stop offset="100%" stop-color="#081021"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Book Background -->
  <rect width="400" height="560" fill="url(#bgGrad)"/>

  <!-- Book Spine Effect (Left Side Shadow) -->
  <rect x="0" y="0" width="14" height="560" fill="#000" opacity="0.28"/>
  <line x1="14" y1="0" x2="14" y2="560" stroke="#FFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Double Decorative Literary Frame -->
  <rect x="24" y="24" width="352" height="512" rx="2" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-opacity="0.75"/>
  <rect x="30" y="30" width="340" height="500" rx="1" fill="none" stroke="#FDE047" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Top Banner / Editorial Brand -->
  <text x="200" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-weight="600" fill="#FDE047" letter-spacing="3.5" text-anchor="middle" opacity="0.9">ÉDITIONS ENTRELINHA</text>
  <line x1="130" y1="66" x2="270" y2="66" stroke="#FDE047" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="200" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" fill="#E2E8F0" letter-spacing="2" text-anchor="middle" opacity="0.75">COLLECTION LECTURE IMMERSIVE</text>

  <!-- CEFR Level Pill Badge -->
  <g transform="translate(200, 105)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#FDE047" fill-opacity="0.15" stroke="#FDE047" stroke-width="1"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#FDE047" letter-spacing="1.2" text-anchor="middle">A2 • ÉLÉMENTAIRE</text>
  </g>

  <!-- Bespoke Central Artwork -->
  <g filter="url(#subtleShadow)">
    
      <!-- Desert Dune, Fox silhouette, Star & Asteroid B612 -->
      <circle cx='200' cy='290' r='85' fill='#192A4D'/>
      <path d='M100 320 Q200 270 300 320' fill='#243B66'/>
      <!-- Fox silhouette sitting -->
      <path d='M215 275 C215 260, 225 255, 230 255 C235 255, 245 260, 245 275 L248 290 L212 290 Z' fill='#F97316'/>
      <polygon points='223,255 227,243 232,255' fill='#EA580C'/>
      <polygon points='235,255 240,243 244,255' fill='#EA580C'/>
      <!-- Big Golden Star -->
      <polygon points='200,165 205,180 220,180 208,190 212,205 200,195 188,205 192,190 180,180 195,180' fill='#FDE047'/>
      <!-- Little companion stars -->
      <circle cx='140' cy='185' r='2.5' fill='#FFF'/>
      <circle cx='260' cy='195' r='2' fill='#FFF'/>
      <circle cx='165' cy='225' r='2' fill='#FDE047'/>
    
  </g>

  <!-- Decorative Separator Rule -->
  <g transform="translate(200, 375)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#FDE047" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="0,-3 4,0 0,3 -4,0" fill="#FDE047"/>
  </g>

  <!-- Title (Multi-line handled cleanly) -->
  <g transform="translate(200, 415)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      Le Petit Prince
    </text>
  </g>

  <!-- Author Attribution -->
  <text x="200" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FDE047" letter-spacing="2.5" text-anchor="middle">ANTOINE DE SAINT-EXUPÉRY</text>

  <!-- Genre Tag -->
  <text x="200" y="475" font-family="'Lora', Georgia, serif" font-style="italic" font-size="9.5" fill="#CBD5E1" text-anchor="middle" opacity="0.8">Conte Poétique & Philosophique</text>

  <!-- Footer Seal -->
  <line x1="150" y1="505" x2="250" y2="505" stroke="#FDE047" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="200" y="518" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-weight="600" fill="#FDE047" letter-spacing="3" text-anchor="middle" opacity="0.7">PARIS • ENSEIGNEMENT DU FRANÇAIS</text>
</svg>