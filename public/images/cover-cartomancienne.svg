<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1B36"/>
      <stop offset="100%" stop-color="#130A1B"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D8B4FE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D8B4FE" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Book Background -->
  <rect width="400" height="560" fill="url(#bgGrad)"/>

  <!-- Book Spine Effect (Left Side Shadow) -->
  <rect x="0" y="0" width="14" height="560" fill="#000" opacity="0.28"/>
  <line x1="14" y1="0" x2="14" y2="560" stroke="#FFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Double Decorative Literary Frame -->
  <rect x="24" y="24" width="352" height="512" rx="2" fill="none" stroke="#D8B4FE" stroke-width="1.5" stroke-opacity="0.75"/>
  <rect x="30" y="30" width="340" height="500" rx="1" fill="none" stroke="#D8B4FE" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Top Banner / Editorial Brand -->
  <text x="200" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-weight="600" fill="#D8B4FE" letter-spacing="3.5" text-anchor="middle" opacity="0.9">ÉDITIONS ENTRELINHA</text>
  <line x1="130" y1="66" x2="270" y2="66" stroke="#D8B4FE" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="200" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" fill="#E2E8F0" letter-spacing="2" text-anchor="middle" opacity="0.75">COLLECTION LECTURE IMMERSIVE</text>

  <!-- CEFR Level Pill Badge -->
  <g transform="translate(200, 105)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#D8B4FE" fill-opacity="0.15" stroke="#D8B4FE" stroke-width="1"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#D8B4FE" letter-spacing="1.2" text-anchor="middle">B2 • AVANCÉ</text>
  </g>

  <!-- Bespoke Central Artwork -->
  <g filter="url(#subtleShadow)">
    
      <!-- Mystic Tarot Card & Mirror of Destiny -->
      <rect x='155' y='185' width='90' height='135' rx='6' fill='#1E112A' stroke='#D8B4FE' stroke-width='3'/>
      <rect x='162' y='192' width='76' height='121' rx='4' fill='none' stroke='#8B5CF6' stroke-width='1.5'/>
      <!-- Tarot Symbol: Wheel of fortune and moon -->
      <circle cx='200' cy='245' r='22' fill='none' stroke='#D8B4FE' stroke-width='2'/>
      <path d='M190 245 C190 235, 210 235, 210 245 C210 255, 190 255, 190 245' fill='#C084FC'/>
      <circle cx='200' cy='212' r='4' fill='#FDE047'/>
      <circle cx='200' cy='278' r='4' fill='#FDE047'/>
      <circle cx='167' cy='245' r='4' fill='#FDE047'/>
      <circle cx='233' cy='245' r='4' fill='#FDE047'/>
    
  </g>

  <!-- Decorative Separator Rule -->
  <g transform="translate(200, 375)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#D8B4FE" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="0,-3 4,0 0,3 -4,0" fill="#D8B4FE"/>
  </g>

  <!-- Title (Multi-line handled cleanly) -->
  <g transform="translate(200, 415)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      La Cartomancienne
    </text>
  </g>

  <!-- Author Attribution -->
  <text x="200" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#D8B4FE" letter-spacing="2.5" text-anchor="middle">MACHADO DE ASSIS</text>

  <!-- Genre Tag -->
  <text x="200" y="475" font-family="'Lora', Georgia, serif" font-style="italic" font-size="9.5" fill="#CBD5E1" text-anchor="middle" opacity="0.8">Nouvelle Psychologique</text>

  <!-- Footer Seal -->
  <line x1="150" y1="505" x2="250" y2="505" stroke="#D8B4FE" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="200" y="518" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-weight="600" fill="#D8B4FE" letter-spacing="3" text-anchor="middle" opacity="0.7">PARIS • ENSEIGNEMENT DU FRANÇAIS</text>
</svg>