<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182736"/>
      <stop offset="100%" stop-color="#0C1620"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Book Background -->
  <rect width="400" height="560" fill="url(#bgGrad)"/>

  <!-- Book Spine Effect (Left Side Shadow) -->
  <rect x="0" y="0" width="14" height="560" fill="#000" opacity="0.28"/>
  <line x1="14" y1="0" x2="14" y2="560" stroke="#FFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Double Decorative Literary Frame -->
  <rect x="24" y="24" width="352" height="512" rx="2" fill="none" stroke="#E5A93C" stroke-width="1.5" stroke-opacity="0.75"/>
  <rect x="30" y="30" width="340" height="500" rx="1" fill="none" stroke="#E5A93C" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- Top Banner / Editorial Brand -->
  <text x="200" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="9" font-weight="600" fill="#E5A93C" letter-spacing="3.5" text-anchor="middle" opacity="0.9">ÉDITIONS ENTRELINHA</text>
  <line x1="130" y1="66" x2="270" y2="66" stroke="#E5A93C" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="200" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="500" fill="#E2E8F0" letter-spacing="2" text-anchor="middle" opacity="0.75">COLLECTION LECTURE IMMERSIVE</text>

  <!-- CEFR Level Pill Badge -->
  <g transform="translate(200, 105)">
    <rect x="-65" y="-11" width="130" height="22" rx="11" fill="#E5A93C" fill-opacity="0.15" stroke="#E5A93C" stroke-width="1"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#E5A93C" letter-spacing="1.2" text-anchor="middle">A2 • ÉLÉMENTAIRE</text>
  </g>

  <!-- Bespoke Central Artwork -->
  <g filter="url(#subtleShadow)">
    
      <!-- Victorian Pocket Watch & Travel Globe -->
      <circle cx='200' cy='250' r='60' fill='none' stroke='#E5A93C' stroke-width='4'/>
      <circle cx='200' cy='250' r='52' fill='none' stroke='#334E68' stroke-width='1.5'/>
      <!-- Watch Roman ticks -->
      <circle cx='200' cy='198' r='3' fill='#E5A93C'/>
      <circle cx='252' cy='250' r='3' fill='#E5A93C'/>
      <circle cx='200' cy='302' r='3' fill='#E5A93C'/>
      <circle cx='148' cy='250' r='3' fill='#E5A93C'/>
      <!-- Watch hands at 11:45 -->
      <line x1='200' y1='250' x2='200' y2='212' stroke='#FFF' stroke-width='2.5' stroke-linecap='round'/>
      <line x1='200' y1='250' x2='175' y2='240' stroke='#E5A93C' stroke-width='2.5' stroke-linecap='round'/>
      <circle cx='200' cy='250' r='5' fill='#E5A93C'/>
      <!-- Watch top winding knob -->
      <rect x='194' y='178' width='12' height='10' rx='2' fill='#E5A93C'/>
      <circle cx='200' cy='173' r='10' fill='none' stroke='#E5A93C' stroke-width='2.5'/>
      <!-- Hot air balloon silhouette in distance -->
      <path d='M280 185 C295 185, 298 200, 288 212 L280 220 L272 212 C262 200, 265 185, 280 185 Z' fill='#E5A93C' opacity='0.75'/>
    
  </g>

  <!-- Decorative Separator Rule -->
  <g transform="translate(200, 375)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#E5A93C" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="0,-3 4,0 0,3 -4,0" fill="#E5A93C"/>
  </g>

  <!-- Title (Multi-line handled cleanly) -->
  <g transform="translate(200, 415)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      Le Tour du Monde en 80 Jours
    </text>
  </g>

  <!-- Author Attribution -->
  <text x="200" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#E5A93C" letter-spacing="2.5" text-anchor="middle">JULES VERNE</text>

  <!-- Genre Tag -->
  <text x="200" y="475" font-family="'Lora', Georgia, serif" font-style="italic" font-size="9.5" fill="#CBD5E1" text-anchor="middle" opacity="0.8">Aventure & Voyage</text>

  <!-- Footer Seal -->
  <line x1="150" y1="505" x2="250" y2="505" stroke="#E5A93C" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="200" y="518" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-weight="600" fill="#E5A93C" letter-spacing="3" text-anchor="middle" opacity="0.7">PARIS • ENSEIGNEMENT DU FRANÇAIS</text>
</svg>